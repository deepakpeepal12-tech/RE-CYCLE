{% extends "base.html" %}{% block title %}Login | RE-CYCLE{% endblock %}{% block body %}<section class="card form-card"><div class="eyebrow">Welcome back</div><h1>Recycle more. Earn more.</h1><p class="muted">Log in to track your bottles, points and recycling journey.</p><form method="post"><label>Mobile number</label><input name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="Enter 10-digit mobile number" required><label>Password</label><input name="password" type="password" placeholder="Your password" required><button class="primary-btn">Log in to dashboard</button></form><p class="auth-note">New to RE-CYCLE? <a href="/register">Create an account</a></p><p class="auth-note"><a href="/admin/login">Administrator access</a></p></section>{% endblock %}
