{% extends "base.html" %}{% block title %}Join RE-CYCLE{% endblock %}{% block body %}<section class="card form-card"><div class="eyebrow">Join the green movement</div><h1>Create your account</h1><p class="muted">Start recycling plastic bottles and collect reward points.</p><form method="post"><label>10-digit mobile number</label><input name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="Enter mobile number" required><label>Create password</label><input name="password" type="password" minlength="8" placeholder="At least 8 characters" required><button class="primary-btn">Create my account</button></form><p class="auth-note">Already registered? <a href="/login">Log in</a></p></section>{% endblock %}
