<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#159447"><title>{% block title %}RE-CYCLE{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><script>
(function(){const t=localStorage.getItem('recycle-theme')||'light';document.documentElement.dataset.theme=t;})();
</script></head><body><main class="wrap"><header class="topbar"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 3-4 3 4"/><path d="M10 3h3a3 3 0 0 1 2.6 1.5l1.2 2"/><path d="m17 17 5-1-1 5"/><path d="m22 16-1.5 2.6A3 3 0 0 1 17.9 20H15"/><path d="m5 14-4-3 4-3"/><path d="M1 11v3a3 3 0 0 0 3 3h2.5"/></svg></span><span>RE-CYCLE<small>SMART RECYCLING REWARDS</small></span></a><div class="top-actions"><button class="theme-btn" type="button" id="themeToggle" onclick="toggleTheme()">🌙 Dark mode</button></div></header>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}<footer class="footer">♻ Small actions. Cleaner tomorrow. · RE-CYCLE</footer></main><script>
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('recycle-theme',t);const b=document.getElementById('themeToggle');if(b)b.textContent=t==='dark'?'☀️ Light mode':'🌙 Dark mode';}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');}
document.addEventListener('DOMContentLoaded',()=>applyTheme(document.documentElement.dataset.theme||'light'));
</script></body></html>
